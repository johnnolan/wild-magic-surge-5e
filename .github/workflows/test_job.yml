on:
  workflow_call:

jobs:
  test:
    name: Typecheck and Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run production typecheck
        run: yarn run typecheck

      - name: Run browser test typecheck
        if: ${{ !cancelled() }}
        run: yarn typecheck:e2e

      - name: Run Jest
        if: ${{ !cancelled() }}
        run: yarn run test:coverage

      - name: Summarize Jest and coverage
        if: ${{ !cancelled() }}
        run: node ./scripts/ci/report-jest.mjs

      - name: Upload Clover Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clover
          path: coverage/clover.xml

      - name: Upload Junit Artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: test-results/junit/results.xml
