name: "[Workflow] Release"

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    uses: ./.github/workflows/lint_job.yml

  test:
    name: Typecheck and Jest
    uses: ./.github/workflows/test_job.yml

  create_changelog_commit:
    name: Create and commit Changelog
    needs: ['lint', 'test']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.PAT }}

    - name: Update Changelog
      uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
      with:
        latest-version: ${{ github.event.release.tag_name }}
        release-notes: ${{ github.event.release.body }}

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: yarn

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build Module
      run: yarn run build
    
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_REPOSITORY: ${{ github.repository }}
      run: |
        jq --arg version "$RELEASE_TAG" \
          --arg url "https://github.com/$RELEASE_REPOSITORY" \
          --arg manifest "https://github.com/$RELEASE_REPOSITORY/releases/latest/download/module.json" \
          --arg download "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/module.zip" \
          '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
          module.json > module.tmp.json && mv module.tmp.json module.json

    # Create a zip file with all files required by the module to add to the release
    - run: zip -r ./module.zip module.json CHANGELOG.md LICENSE dist/ languages/ templates/ packs/

    # Create a release for this specific version
    - name: Update Release with Files
      id: create_version_release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        name: ${{ github.event.release.name }}
        draft: ${{ github.event.release.unpublished }}
        prerelease: ${{ github.event.release.prerelease }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './module.json, ./module.zip'
        body: ${{ github.event.release.body }}
        allowUpdates: true

    - name: Commit updated CHANGELOG
      uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        branch: ${{ github.event.release.target_commitish }}
        commit_message: Update CHANGELOG
        file_pattern: CHANGELOG.md

    - name: Publish package to Foundry VTT
      if: ${{ !github.event.release.prerelease }}
      env:
        FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_URL: ${{ github.event.release.html_url }}
      run: |
        if [ -z "$FOUNDRY_RELEASE_TOKEN" ]; then
          echo "::error::Add the FOUNDRY_RELEASE_TOKEN repository secret to publish to Foundry VTT."
          exit 1
        fi

        payload=$(jq --arg manifest "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/module.json" \
          --arg notes "$RELEASE_URL" \
          '{id: .id, release: {version: .version, manifest: $manifest, notes: $notes, compatibility: .compatibility}}' \
          module.json)

        response_file=$(mktemp)
        trap 'rm -f "$response_file"' EXIT
        curl --fail-with-body --silent --show-error \
          --connect-timeout 30 --max-time 120 \
          --request POST \
          --header "Authorization: $FOUNDRY_RELEASE_TOKEN" \
          --header "Content-Type: application/json" \
          --data "$payload" \
          --output "$response_file" \
          https://foundryvtt.com/_api/packages/release_version/ || {
            cat "$response_file"
            exit 1
          }
        cat "$response_file"
        jq --exit-status '.status == "success"' "$response_file"
